apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-mongodb-deployment
  namespace: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      volumes:
        - name: mongodb-volume
          persistentVolumeClaim: 
            claimName: mongodb-pvc
      containers:
        - name: my-mongodb-pod
          image: mongo
          volumeMounts:
          - name: mongodb-volume
            mountPath: /data/db
          ports:
          - containerPort: 27017
          env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: mongo-root-username                
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: mongo-root-password